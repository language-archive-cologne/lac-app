volumes:
  lacos_local_postgres_data: {}
  lacos_local_postgres_data_backups: {}
  lacos_local_redis_data: {}
  seaweedfs_data: {}

networks:
  lacos_network_ws:
    driver: bridge

services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
      target: test-run-stage
    image: lacos_local_django
    restart: "on-failure:3"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      pgbouncer:
        condition: service_started
      minio:
        condition: service_healthy
    volumes:
      - .:/app:z
      - ../lac-guidelines:/lac-guidelines:ro
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
      - ./.envs/.local/.storage
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "6432"
      CONN_MAX_AGE: "0"
      DISABLE_SERVER_SIDE_CURSORS: "true"
      SAML_LOGIN_ENABLED: "true"
      SAML_DJANGO_USER_MAIN_ATTRIBUTE: "username"
      SAML_USE_NAME_ID_AS_USERNAME: "false"
      SAML_SP_BASE_URL: "http://localhost:8101"
      SAML2_DISCO_URL: "https://discovery.clarin.eu/feed/edugain"
      SAML_IDP_METADATA_LOCAL: "/app/shibboleth.xml"
      LAC_MEDIA_TMP_DIR: "/app/.tmp/media-processing"
    ports:
      - '127.0.0.1:8101:8000'
    command: /start
    networks:
      - lacos_network_ws

  pgbouncer:
    build:
      context: .
      dockerfile: ./compose/production/pgbouncer/Dockerfile
    image: lacos_local_pgbouncer
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.envs/.local/.postgres
    environment:
      PGBOUNCER_SERVER_HOST: postgres
      PGBOUNCER_SERVER_PORT: "5432"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "500"
      PGBOUNCER_DEFAULT_POOL_SIZE: "30"
      PGBOUNCER_RESERVE_POOL_SIZE: "10"
      PGBOUNCER_QUERY_TIMEOUT: "300"
      PGBOUNCER_INCLUDE_TEST_DATABASES: "1"
    ports:
      - "127.0.0.1:6431:6432"
    networks:
      - lacos_network_ws

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: lacos_production_postgres
    command: postgres -c max_connections=200 -c shared_preload_libraries=pg_stat_statements
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - lacos_local_postgres_data:/var/lib/postgresql/data
      - lacos_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p $${POSTGRES_PORT:-5432} -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lacos_network_ws

  # SeaweedFS S3 gateway. MinIO no longer publishes its images. The service
  # keeps the name "minio" so that AWS_S3_ENDPOINT_URL needs no change.
  minio:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:9100:9000"
    volumes:
      - seaweedfs_data:/data
      - ./compose/local/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    entrypoint: ["/entrypoint.sh"]
    command: >
      server -dir=/data -ip=minio -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024
      -s3 -s3.port=9000 -s3.ip.bind=0.0.0.0
      -s3.config=/etc/seaweedfs/s3.json
    healthcheck:
      # An anonymous request gets 403, which also means the gateway is up.
      test: ["CMD-SHELL", "wget -S -q -O /dev/null http://127.0.0.1:9000/ 2>&1 | grep -qE 'HTTP/1.1 (200|403)'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - lacos_network_ws


  redis:
    image: "redis:8.2-alpine@sha256:a308ca111032fa8f306a2dc7be7ba5deb8b777ed5d258c733cddba48a1fd7904"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - lacos_local_redis_data:/data
    ports:
      - "127.0.0.1:6381:6379"
    networks:
      - lacos_network_ws
    command: redis-server --appendonly yes

  huey:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
      target: worker-run-stage
    image: lacos_local_huey
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - django
      - pgbouncer
      - redis
    volumes:
      - .:/app:z
      - ../lac-guidelines:/lac-guidelines:ro
      - lacos_local_postgres_data_backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_DOCKER_BIN:-/usr/bin/docker}:/usr/bin/docker:ro
      - ${HOST_DOCKER_COMPOSE_PLUGIN:-/usr/libexec/docker/cli-plugins/docker-compose}:/usr/libexec/docker/cli-plugins/docker-compose:ro
    group_add:
      - "${DOCKER_GID:-999}"
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
      - ./.envs/.local/.storage
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "6432"
      CONN_MAX_AGE: "0"
      DISABLE_SERVER_SIDE_CURSORS: "true"
      SAML_LOGIN_ENABLED: "true"
      SAML_DJANGO_USER_MAIN_ATTRIBUTE: "username"
      SAML_USE_NAME_ID_AS_USERNAME: "false"
      SAML_SP_BASE_URL: "http://localhost:8101"
      SAML2_DISCO_URL: "https://discovery.clarin.eu/feed/edugain"
      SAML_IDP_METADATA_LOCAL: "/app/shibboleth.xml"
      DB_BACKUP_ENABLED: "false"
      HUEY_WORKERS: "1"
      LAC_MEDIA_TMP_DIR: "/app/.tmp/media-processing"
    command: /bin/sh -c "python manage.py run_huey"
    networks:
      - lacos_network_ws

  node:
    image: node:22-alpine
    depends_on:
      - django
    working_dir: /app/theme/static_src
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app:z
    command: /bin/sh -c "npm install && npm run dev"
    tty: true
    networks:
      - lacos_network_ws
