stages:
  - validate
  - deploy

.deploy_base:
  stage: deploy
  image: alpine:3.21
  tags:
    - charch
  before_script:
    - apk add --no-cache bash openssh-client
    - scripts/ci/configure-ssh.sh
  environment:
    name: development
    url: https://dev.lacos.uni-koeln.de

clarin_saml_metadata_preflight:
  extends: .deploy_base
  stage: validate
  resource_group: lacos-production
  environment:
    name: production
    url: https://lacos.uni-koeln.de
  before_script:
    - apk add --no-cache bash openssh-client git openjdk17-jre-headless apache-ant libxml2-utils openssl unzip wget ca-certificates coreutils
    - scripts/ci/configure-ssh.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - scripts/ci/remote-saml-preflight.sh "$CI_COMMIT_SHA" > saml-metadata.xml
    - scripts/validate_saml_metadata_file.sh saml-metadata.xml

deploy_dev_full:
  extends: .deploy_base
  resource_group: lacos-development
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - "requirements/**/*"
        - "docker-compose.dev.yml"
        - ".dockerignore"
        - "compose/**/*"
        - "**/migrations/**/*"
  script:
    - scripts/ci/remote-deploy.sh development full "$CI_COMMIT_SHA"

deploy_dev_fast:
  extends: .deploy_base
  resource_group: lacos-development
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - "requirements/**/*"
        - "docker-compose.dev.yml"
        - ".dockerignore"
        - "compose/**/*"
        - "**/migrations/**/*"
      when: never
    - if: '$CI_COMMIT_BRANCH == "dev"'
  script:
    - scripts/ci/remote-deploy.sh development fast "$CI_COMMIT_SHA"

deploy_prod_full:
  extends: .deploy_base
  resource_group: lacos-production
  environment:
    name: production
    url: https://lacos.uni-koeln.de
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "requirements/**/*"
        - "docker-compose.production.yml"
        - ".dockerignore"
        - "compose/**/*"
        - "**/migrations/**/*"
  script:
    - scripts/ci/remote-deploy.sh production full "$CI_COMMIT_SHA"

deploy_prod_fast:
  extends: .deploy_base
  resource_group: lacos-production
  environment:
    name: production
    url: https://lacos.uni-koeln.de
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "requirements/**/*"
        - "docker-compose.production.yml"
        - ".dockerignore"
        - "compose/**/*"
        - "**/migrations/**/*"
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - scripts/ci/remote-deploy.sh production fast "$CI_COMMIT_SHA"

# Docker cleanup is handled by a threshold-gated Huey periodic task
# (lacos/common/docker_prune_tasks.py), not by CI.
