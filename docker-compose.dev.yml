volumes:
  lacos_dev_postgres_data: {}
  lacos_dev_postgres_data_backups: {}
  lacos_dev_redis_data: {}

networks:
  lacos_dev_network:
    driver: bridge

services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
      target: web-run-stage
      args:
        UV_LINK_MODE: copy
    image: lacos_dev_django
    container_name: lacos_dev_django
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - pgbouncer
      - redis
      - cache
    volumes:
      - .:/app:z
      - /etc/shibboleth:/etc/shibboleth:ro
      - /opt/lacos/lac-guidelines:/app/lac-guidelines:ro
    env_file:
      - ./.envs/.dev/.django
      - ./.envs/.dev/.postgres
      - ./.envs/.dev/.storage
      - ./.envs/.dev/.docker
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "6432"
      CONN_MAX_AGE: "0"
      DISABLE_SERVER_SIDE_CURSORS: "true"
      SAML_LOGIN_ENABLED: "true"
      SAML_DJANGO_USER_MAIN_ATTRIBUTE: "username"
      SAML_USE_NAME_ID_AS_USERNAME: "false"
      GUIDELINES_REPO_URL: /app/lac-guidelines
      LAC_MEDIA_TMP_DIR: "/app/.tmp/media-processing"
      DJANGO_HEALTHCHECK_HOST: "dev.lacos.uni-koeln.de"
      CACHE_REDIS_URL: "redis://cache:6379/0"
      PUBLIC_SEARCH_INDEX_ENABLED: "true"
      PUBLIC_SEARCH_INDEX_PATH: "/app/.tmp/public-search-index.json"
      DISCOVERY_REFRESH_ENABLED: "true"
      DISCOVERY_REFRESH_DEBOUNCE_SECONDS: "30"
    ports:
      - '127.0.0.1:8102:8000'
    command: /start-production
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/health/ready/', headers={'Host': os.environ['DJANGO_HEALTHCHECK_HOST'], 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - lacos_dev_network
    dns:
      - ${DNS_PRIMARY}
      - ${DNS_SECONDARY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${S3_HOSTNAME}:${S3_IP}"

  pgbouncer:
    build:
      context: .
      dockerfile: ./compose/production/pgbouncer/Dockerfile
    image: lacos_dev_pgbouncer
    container_name: lacos_dev_pgbouncer
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - postgres
    env_file:
      - ./.envs/.dev/.postgres
    environment:
      PGBOUNCER_SERVER_HOST: postgres
      PGBOUNCER_SERVER_PORT: "5432"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "500"
      PGBOUNCER_DEFAULT_POOL_SIZE: "30"
      PGBOUNCER_RESERVE_POOL_SIZE: "10"
      PGBOUNCER_QUERY_TIMEOUT: "300"
    ports:
      - '127.0.0.1:6433:6432'
    networks:
      - lacos_dev_network

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: lacos_dev_postgres
    container_name: lacos_dev_postgres
    restart: unless-stopped
    command: postgres -c max_connections=200 -c shared_preload_libraries=pg_stat_statements
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - lacos_dev_postgres_data:/var/lib/postgresql/data
      - lacos_dev_postgres_data_backups:/backups
    env_file:
      - ./.envs/.dev/.postgres
    ports:
      - '127.0.0.1:5433:5432'
    networks:
      - lacos_dev_network

  redis:
    image: "redis:8.2-alpine@sha256:a308ca111032fa8f306a2dc7be7ba5deb8b777ed5d258c733cddba48a1fd7904"
    container_name: lacos_dev_redis
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - lacos_dev_redis_data:/data
    ports:
      - '127.0.0.1:6370:6379'
    networks:
      - lacos_dev_network

  cache:
    image: "redis:8.2-alpine@sha256:a308ca111032fa8f306a2dc7be7ba5deb8b777ed5d258c733cddba48a1fd7904"
    container_name: lacos_dev_cache
    restart: unless-stopped
    command: redis-server --loglevel warning --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lacos_dev_network

  huey:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
      target: worker-run-stage
      args:
        UV_LINK_MODE: copy
    image: lacos_dev_huey
    container_name: lacos_dev_huey
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - django
      - pgbouncer
      - redis
      - cache
    volumes:
      - .:/app:z
      - /etc/shibboleth:/etc/shibboleth:ro
      - lacos_dev_postgres_data_backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_DOCKER_BIN:-/usr/bin/docker}:/usr/bin/docker:ro
      - ${HOST_DOCKER_COMPOSE_PLUGIN:-/usr/libexec/docker/cli-plugins/docker-compose}:/usr/libexec/docker/cli-plugins/docker-compose:ro
    group_add:
      - "${DOCKER_GID:-999}"
    env_file:
      - ./.envs/.dev/.django
      - ./.envs/.dev/.postgres
      - ./.envs/.dev/.storage
      - ./.envs/.dev/.docker
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "6432"
      CONN_MAX_AGE: "0"
      DISABLE_SERVER_SIDE_CURSORS: "true"
      SAML_LOGIN_ENABLED: "true"
      SAML_DJANGO_USER_MAIN_ATTRIBUTE: "username"
      SAML_USE_NAME_ID_AS_USERNAME: "false"
      DB_BACKUP_ENABLED: "true"
      DB_BACKUP_COMPOSE_FILE: "docker-compose.dev.yml"
      DB_BACKUP_COMPOSE_PROJECT_DIR: "/app"
      DB_BACKUP_COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:-lac-app}"
      HUEY_IMMEDIATE: "false"
      HUEY_WORKERS: "4"
      LAC_MEDIA_TMP_DIR: "/app/.tmp/media-processing"
      CACHE_REDIS_URL: "redis://cache:6379/0"
      PUBLIC_SEARCH_INDEX_ENABLED: "true"
      PUBLIC_SEARCH_INDEX_PATH: "/app/.tmp/public-search-index.json"
      DISCOVERY_REFRESH_ENABLED: "true"
      DISCOVERY_REFRESH_DEBOUNCE_SECONDS: "30"
    command: /bin/sh -c "python manage.py run_huey"
    networks:
      - lacos_dev_network
    dns:
      - ${DNS_PRIMARY}
      - ${DNS_SECONDARY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${S3_HOSTNAME}:${S3_IP}"

  theme:
    image: node:22-alpine
    container_name: lacos_dev_theme
    working_dir: /app/theme/static_src
    volumes:
      - .:/app:z
    command: sh -c "npm ci && npm run build"
    profiles:
      - build
